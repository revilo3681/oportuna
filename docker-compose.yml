name: oportuna

x-api-env: &api-env
  OPORTUNA_ENVIRONMENT: ${OPORTUNA_ENVIRONMENT:-development}
  OPORTUNA_DATABASE_URL: postgresql+psycopg://oportuna:oportuna@db:5432/oportuna
  OPORTUNA_REDIS_URL: redis://redis:6379/0
  OPORTUNA_JWT_SECRET: ${OPORTUNA_JWT_SECRET:-dev-only-change-this-secret-before-deploying-32}
  OPORTUNA_PUBLIC_SITE_URL: ${OPORTUNA_PUBLIC_SITE_URL:-http://localhost:8080}
  OPORTUNA_CORS_ORIGINS: ${OPORTUNA_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  OPORTUNA_SEED_ADMIN_EMAIL: ${OPORTUNA_SEED_ADMIN_EMAIL:-admin@oportuna.local}
  OPORTUNA_SEED_ADMIN_PASSWORD: ${OPORTUNA_SEED_ADMIN_PASSWORD:-oportuna-admin-2026}
  OPORTUNA_INGEST_INTERVAL_MINUTES: ${OPORTUNA_INGEST_INTERVAL_MINUTES:-360}
  OPORTUNA_VERIFY_INTERVAL_MINUTES: ${OPORTUNA_VERIFY_INTERVAL_MINUTES:-60}
  OPORTUNA_DIGEST_HOUR_UTC: ${OPORTUNA_DIGEST_HOUR_UTC:-12}
  OPORTUNA_AUTO_PUBLISH_MIN_CONFIDENCE: ${OPORTUNA_AUTO_PUBLISH_MIN_CONFIDENCE:-0.70}
  OPORTUNA_HTTP_USER_AGENT: "${OPORTUNA_HTTP_USER_AGENT:-OportunaBot/0.1 (+https://github.com/oportuna; opportunity research; contact: hello@oportuna.dev)}"
  OPORTUNA_LLM_API_KEY: ${OPORTUNA_LLM_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oportuna
      POSTGRES_PASSWORD: oportuna
      POSTGRES_DB: oportuna
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oportuna -d oportuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./apps/api
    command: ["arq", "oportuna.worker.WorkerSettings"]
    environment:
      <<: *api-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./apps/api
    command: ["python", "-m", "oportuna.scheduler"]
    environment:
      <<: *api-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      OPORTUNA_INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${OPORTUNA_PUBLIC_SITE_URL:-http://localhost:8080}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
