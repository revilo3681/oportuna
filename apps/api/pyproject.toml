[project]
name = "oportuna"
version = "0.1.0"
description = "Oportuna — global tech opportunity intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.32,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "arq>=0.26,<1",
  "redis>=5,<7",
  "icalendar>=6.0,<7",
  "feedparser>=6.0.11,<7",
  "python-dateutil>=2.9,<3",
  "pycountry>=24,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = { find = { include = ["oportuna*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
